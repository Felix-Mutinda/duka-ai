[project]
name = "duka-ai"
version = "0.1.0"
description = "Simulated, guardrail-first AI shop assistant demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.22.0",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "tools", "rag", "eval", "observability"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "tools", "rag", "ui", "eval", "tests", "observability"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=core --cov=tools --cov=rag --cov=eval --cov=observability --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["core", "tools", "rag", "eval", "observability", "ui"]
omit = [
    "app.py",
    "ui/interface.py",
    "observability/export_demo.py",
    "eval/run_eval.py",
]

